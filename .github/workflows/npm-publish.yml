name: Release to npm

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Detect release type from commit message
        id: release
        run: |
          MSG=$(git log -1 --pretty=%B)
          if [[ "$MSG" == "release: major"* ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif [[ "$MSG" == "release: minor"* ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif [[ "$MSG" == "release:"* ]]; then
            echo "type=patch" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        if: steps.release.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ steps.release.outputs.type }} -m "release: %s [skip ci]"

      - name: Publish to npm
        if: steps.release.outputs.should_release == 'true'
        run: npm publish --provenance --access public

      - name: Push version bump
        if: steps.release.outputs.should_release == 'true'
        run: git push origin main --follow-tags
